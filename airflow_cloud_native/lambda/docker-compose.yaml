x-airflow-common: &airflow-common
  build:
    context: .
    args:
      AIRFLOW_IMAGE_NAME: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.0.2-python3.12}
  image: lambda/airflow:local
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.session
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Workers in Airflow 3 talk to the apiserver over HTTP to report task state;
    # default URL points at localhost which inside the worker container is wrong.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__BASE_URL: http://airflow-apiserver:8080
    # Shared JWT secret so worker-signed tokens verify on the apiserver side.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-lambda-local-dev-secret-change-me}
    PYTHONPATH: /opt/airflow/src
    # Pipeline-level wiring (mirrored from .env so tasks can read them)
    LAMBDA_KAFKA_BOOTSTRAP: redpanda:9092
    LAMBDA_SCHEMA_REGISTRY: http://redpanda:8081
    LAMBDA_TOPIC: ${LAMBDA_TOPIC:-events}
    LAMBDA_S3_ENDPOINT: http://minio:9000
    LAMBDA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    LAMBDA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    LAMBDA_BUCKET: ${LAMBDA_BUCKET:-lambda-lake}
    LAMBDA_WAREHOUSE_DSN: postgresql://${WAREHOUSE_USER:-warehouse}:${WAREHOUSE_PASSWORD:-warehouse}@postgres:5432/${WAREHOUSE_DB:-warehouse}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./src:/opt/airflow/src
    - ./scripts:/opt/airflow/scripts
    - ./tests:/opt/airflow/tests
    # Simple Auth Manager opens this file in "a+" mode at boot, so do NOT mount :ro.
    - ./config/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json.generated
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    redpanda:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      WAREHOUSE_DB: ${WAREHOUSE_DB:-warehouse}
      WAREHOUSE_USER: ${WAREHOUSE_USER:-warehouse}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres-init.sh:/docker-entrypoint-initdb.d/10-create-warehouse.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.2.10
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --mode=dev-container
    ports:
      - "19092:19092"
      - "18081:18081"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "8081:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/${LAMBDA_BUCKET:-lambda-lake} &&
      echo 'MinIO bucket ready';
      "

  airflow-init:
    <<: *airflow-common
    # Use the image's default entrypoint so /etc/passwd gets patched for the
    # host UID. In Airflow 3 `airflow users create` is gone (provided only by
    # the FAB auth manager); Simple Auth Manager reads credentials from the
    # mounted passwords file instead.
    command: db migrate
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/version"]
      interval: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8974/health"]
      interval: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: unless-stopped

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
