x-airflow-common: &airflow-common
  build:
    context: .
    args:
      AIRFLOW_IMAGE_NAME: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.0.2-python3.12}
  image: medallion/airflow:local
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.session
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # In Airflow 3 the task subprocess (even under LocalExecutor) reports state
    # to the apiserver over HTTP. Default URL is localhost — wrong inside the
    # scheduler container — so point it at the apiserver service explicitly.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__BASE_URL: http://airflow-apiserver:8080
    # Shared JWT secret so the task-side token verifies on the apiserver side.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-medallion-local-dev-secret-change-me}
    PYTHONPATH: /opt/airflow/src
    # Lakehouse wiring
    LAKE_BUCKET: ${LAKE_BUCKET:-lakehouse}
    LAKE_S3_ENDPOINT: http://minio:9000
    LAKE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    LAKE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # dbt environment — read in profiles.yml via env_var()
    DBT_PROJECT_DIR: /opt/airflow/dbt_project
    DBT_PROFILES_DIR: /opt/airflow/dbt_project
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./src:/opt/airflow/src
    - ./scripts:/opt/airflow/scripts
    - ./dbt_project:/opt/airflow/dbt_project
    - ./source_data:/opt/airflow/source_data
    - ./tests:/opt/airflow/tests
    # Simple Auth Manager opens this file in "a+" mode at boot — do NOT mount :ro.
    - ./config/simple_auth_manager_passwords.json:/opt/airflow/simple_auth_manager_passwords.json.generated
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5452:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9020:9000"
      - "9021:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/${LAKE_BUCKET:-lakehouse} &&
      mc mb -p local/${LAKE_BUCKET:-lakehouse}/bronze &&
      mc mb -p local/${LAKE_BUCKET:-lakehouse}/silver &&
      mc mb -p local/${LAKE_BUCKET:-lakehouse}/gold &&
      echo 'lakehouse layout ready';
      "

  airflow-init:
    <<: *airflow-common
    # Use the image's default entrypoint so /etc/passwd gets patched for the
    # host UID. In Airflow 3 `airflow users create` is gone (provided only by
    # the FAB auth manager); Simple Auth Manager reads credentials from the
    # mounted passwords file instead.
    command: db migrate
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8100:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/version"]
      interval: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8974/health"]
      interval: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
