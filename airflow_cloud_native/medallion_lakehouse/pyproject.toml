[project]
name = "medallion-lakehouse"
version = "0.1.0"
description = "Enterprise-shaped medallion lakehouse without Spark — DuckDB + dbt on Parquet/MinIO, orchestrated by Airflow 3."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars==1.18.0",
    "pyarrow==18.1.0",
    "boto3==1.35.84",
    "s3fs==2024.12.0",
    "pytest>=8",
]

[project.optional-dependencies]
# Installed only inside the Airflow image (see Dockerfile). `dbt-core` is
# pinned to the same minor as `dbt-duckdb` — dbt 1.11 tightened parsing in
# ways that break this project's config. `duckdb` is a transitive dep of
# `dbt-duckdb`; pinned here so the version is explicit.
image = [
    "apache-airflow-providers-amazon==9.1.0",
    "dbt-core>=1.9,<1.10",
    "dbt-duckdb==1.9.0",
    "duckdb==1.1.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
