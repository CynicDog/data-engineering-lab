medallion:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Persist the catalog across dbt runs so models are visible to subsequent tests.
      path: "/tmp/medallion.duckdb"
      threads: 4
      extensions:
        - httpfs
        - parquet
      settings:
        s3_endpoint: "{{ env_var('LAKE_S3_ENDPOINT', 'http://minio:9000') | replace('http://', '') | replace('https://', '') }}"
        s3_access_key_id: "{{ env_var('LAKE_S3_ACCESS_KEY', 'minioadmin') }}"
        s3_secret_access_key: "{{ env_var('LAKE_S3_SECRET_KEY', 'minioadmin') }}"
        s3_region: "us-east-1"
        s3_url_style: "path"
        s3_use_ssl: "false"
