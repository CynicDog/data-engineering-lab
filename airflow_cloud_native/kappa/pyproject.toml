[project]
name = "kappa-pipeline"
version = "0.1.0"
description = "Kappa-architecture pipeline on Airflow 3 — one stream path into Delta + replay-from-log."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars==1.18.0",
    "pyarrow==18.1.0",
    "deltalake==0.22.3",
    "confluent-kafka==2.6.1",
    "boto3==1.35.84",
    "s3fs==2024.12.0",
    "psycopg[binary]==3.2.3",
    "pytest>=8",
]

[project.optional-dependencies]
# Installed only inside the Airflow image (see Dockerfile). Locally these would
# pull in Airflow itself, which is heavy and useless outside Docker.
image = [
    "apache-airflow-providers-apache-kafka==1.6.1",
    "apache-airflow-providers-amazon==9.1.0",
    "apache-airflow-providers-postgres==5.13.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
