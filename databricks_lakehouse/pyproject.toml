[project]
name = "lakehouse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyspark>=3.5.3,<4.0",
    "delta-spark==3.3.0",
    "boto3>=1.35",
    "s3fs>=2024.12.0",
    "pyarrow>=18.1.0",
    "pyyaml>=6.0",
    "psycopg2-binary>=2.9",
    "faker>=30.0",
    "marimo[recommended]>=0.10.0",
    "pytest>=8",
    "ruff>=0.9",
    "pandas>=2.2",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
