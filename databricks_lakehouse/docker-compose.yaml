x-airflow-common:
  &airflow-common
  build: .
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__CORE__SECRET_KEY: "lakehouse-lab-secret-key-do-not-use-in-prod"
    AIRFLOW__API_AUTH__JWT_SECRET: "lakehouse-lab-jwt-secret-do-not-use-in-prod"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:Admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Spark JVM cold-start can exceed the default 5-second httpx timeout;
    # give the execution-API heartbeat client enough headroom to survive it.
    AIRFLOW__WORKERS__API_CLIENT_REQUEST_TIMEOUT: "120"
    # Lake storage (MinIO = ADLS Gen2 equivalent)
    LAKE_BUCKET: lakehouse
    LAKE_S3_ENDPOINT: http://minio:9000
    LAKE_S3_ACCESS_KEY: minioadmin
    LAKE_S3_SECRET_KEY: minioadmin
    # ODS source database (PostgreSQL = on-premise ODS)
    ODS_URL: postgresql+psycopg2://ods:ods@postgres:5432/ods
    LAKEHOUSE_PROFILE: dev
    # Make the lakehouse package importable inside containers
    PYTHONPATH: /opt/airflow/src
    JAVA_HOME: /opt/java-home
  volumes:
    - ./src:/opt/airflow/src
    - ./config:/opt/airflow/config
    - ./dags:/opt/airflow/dags
    - ./tests:/opt/airflow/tests
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5462:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_ods.sql:/docker-entrypoint-initdb.d/01_init_ods.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9030:9000"
      - "9031:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/lakehouse;
        mc mb --ignore-existing local/lakehouse/landing;
        mc mb --ignore-existing local/lakehouse/bronze;
        mc mb --ignore-existing local/lakehouse/silver;
        mc mb --ignore-existing local/lakehouse/gold;
        mc mb --ignore-existing local/lakehouse/control;
        echo 'Bucket layout ready.';
      "

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8110:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
