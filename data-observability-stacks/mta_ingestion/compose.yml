services:
  mta-spark:
    image: apache/spark:3.5.0-python3
    container_name: mta_spark
    user: root
    ports:
      - "4040:4040"
    environment:
      - SPARK_CONF_DIR=/opt/spark/conf
      - SPARK_HOME=/opt/spark
      - SPARK_SUBMIT_OPTS=-Dspark.eventLog.enabled=true -Dspark.eventLog.dir=file:///app/metadata/logs -Dspark.extraListeners=io.openlineage.spark.agent.OpenLineageSparkListener -Dspark.openmetadata.transport.hostPort=http://openmetadata-server:8585 -Dspark.openmetadata.transport.type=openmetadata -Dspark.openmetadata.transport.pipelineServiceName=mta_pipeline -Dspark.openmetadata.transport.pipelineName=mta_preprocessing -Dspark.openmetadata.transport.timeout=30
    volumes:
      - raw-volume:/app/pipeline-storage
      - spark-metadata:/app/metadata
      - ./src:/app
      - ./openmetadata/openmetadata-spark-agent-1.1.jar:/opt/spark/extra-jars/openmetadata-spark-agent.jar
    healthcheck:
      test: ["CMD", "ls", "/app/pipeline-storage"]
      interval: 5s
    command: >
      bash -c "
        mkdir -p /opt/spark/conf
        echo 'spark.driver.extraClassPath /opt/spark/extra-jars/openmetadata-spark-agent.jar' > /opt/spark/conf/spark-defaults.conf
        echo 'spark.executor.extraClassPath /opt/spark/extra-jars/openmetadata-spark-agent.jar' >> /opt/spark/conf/spark-defaults.conf
        
        mkdir -p /app/metadata/logs /app/metadata/checkpoints /app/warehouse
        chmod -R 777 /app/metadata /app/warehouse
      
        echo 'Spark is ready. Workspace: /app'
        tail -f /dev/null
      "

  mta-ingestion:
    image: ghcr.io/cynicdog/uptown-downtown/ingestion:latest
    container_name: mta_ingestion
    volumes:
      - raw-volume:/data/raw
    environment:
      - RAW_BASE_PATH=/data/raw
      - POLL_INTERVAL_SECONDS=30
    restart: on-failure
    depends_on:
      mta-spark:
        condition: service_healthy

volumes:
  raw-volume:
  spark-metadata: